  @Override
  public String generateToken(UserDetails userDetails) {
    Map&lt;String, Object&gt; extraClaims = new HashMap&lt;&gt;();
    List&lt;String&gt; authorities = userDetails.getAuthorities().stream()
        .map(GrantedAuthority::getAuthority).toList();
    extraClaims.put("authorities", authorities);

    return Jwts.builder()

        .subject(userDetails.getUsername())
        .issuedAt(now)
        .expiration(new Date(now.getTime() + jwtExpirationMs))
        .signWith(getSigningKey(), Jwts.SIG.HS256)

    <div style="font-size:14px; font-weight:700; color:var(--icesi-blue); margin-bottom:6px;">1. Extracción de Cabecera Bearer y Token</div>
    <pre><code class="language-java">@Component
@RequiredArgsConstructor
public class JwtAuthenticationFilter extends OncePerRequestFilter {

  private final IJwtService jwtService;
  private final UserDetailsService userDetailsService;

  @Override
  protected void doFilterInternal(
      @NonNull HttpServletRequest req,
      @NonNull HttpServletResponse res,
      @NonNull FilterChain chain)
      throws ServletException, IOException {

    final String authHeader = req.getHeader("Authorization");
    if (authHeader == null || !authHeader.startsWith("Bearer ")) {
      chain.doFilter(req, res);
      return;
    }
    final String jwt = authHeader.substring(7);</code></pre>

    <div style="font-size:14px; font-weight:700; color:var(--icesi-green); margin-bottom:6px;">2. Validación e Inyección en SecurityContextHolder</div>
    <pre><code class="language-java">    try {
      final String email = jwtService.extractUsername(jwt);
      if (email != null &amp;&amp; SecurityContextHolder.getContext()
          .getAuthentication() == null) {
        UserDetails user = userDetailsService
            .loadUserByUsername(email);
        if (jwtService.isTokenValid(jwt, user)) {
          var authToken = new UsernamePasswordAuthenticationToken(
              user, null, user.getAuthorities());
          authToken.setDetails(new WebAuthenticationDetailsSource()
              .buildDetails(req));
          SecurityContextHolder.getContext()
              .setAuthentication(authToken);
        }
      }
    } catch (JwtException | IllegalArgumentException e) {
      SecurityContextHolder.clearContext();
    }
    chain.doFilter(req, res);
  }
}</code></pre>

@RequestMapping("/api/v1/auth")
@RequiredArgsConstructor
public class AuthRestController {
  private final AuthenticationManager authManager;
  private final IJwtService jwtService;

  @PostMapping("/login")
  public ResponseEntity&lt;TokenResponseDTO&gt; login(@RequestBody LoginRequestDTO req) {
    try {
      Authentication auth = authManager.authenticate(
        new UsernamePasswordAuthenticationToken(
          req.getCorreoInstitucional(), req.getPassword()));
      UserDetails user = (UserDetails) auth.getPrincipal();
      String jwt = jwtService.generateToken(user);
      return ResponseEntity.ok(TokenResponseDTO.builder()
          .token(jwt).type("Bearer")
          .expiresIn(jwtService.getExpirationTime())
          .correoInstitucional(user.getUsername()).build());
    } catch (BadCredentialsException e) {
      return ResponseEntity.status(HttpStatus.UNAUTHORIZED).build();
    }
  }
}</code></pre>
