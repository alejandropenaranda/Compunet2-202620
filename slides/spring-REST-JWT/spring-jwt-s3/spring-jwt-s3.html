      <pre><code class="language-java">@Bean
@Order(1)
public SecurityFilterChain apiSecurityFilterChain(HttpSecurity http) 
        throws Exception {
    return http
        // 1. Aislar únicamente endpoints bajo /api/**
        .securityMatcher("/api/**")
        // 2. Desactivar CSRF (Stateless / sin cookies)
        .csrf(csrf -> csrf.disable())
        // 3. Sesiones 100% en token (cero RAM en Tomcat)
        .sessionManagement(s -> s
            .sessionCreationPolicy(SessionCreationPolicy.STATELESS)
        )
        // 4. Reglas públicas vs protegidas
        .authorizeHttpRequests(authz -> authz
            .requestMatchers("/api/v1/auth/**").permitAll()
            .anyRequest().authenticated()
        )
        // ... continua en columna derecha ...</code></pre>

                res.setContentType("application/json");

                  "{\"error\": \"Token JWT ausente o invalido\"}");
            })
            .accessDeniedHandler((req, res, err) -> {
                res.setStatus(HttpServletResponse.SC_FORBIDDEN);
                res.setContentType("application/json");
                res.getWriter().write(

            })
        )

        .addFilterBefore(jwtAuthenticationFilter,
