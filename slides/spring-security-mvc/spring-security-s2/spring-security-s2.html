public class CustomUserDetails implements UserDetails {
  private final Usuario usuario;

  @Override
  public Collection&lt;? extends GrantedAuthority&gt; getAuthorities() {
    Set&lt;GrantedAuthority&gt; auths = new HashSet&lt;&gt;();
    for (Rol rol : usuario.getRoles()) {
      auths.add(new SimpleGrantedAuthority("ROLE_" + rol.getNombre()));
      for (Permiso p : rol.getPermisos()) {
        auths.add(new SimpleGrantedAuthority(p.getNombre()));
      }
    }
    return auths;
  }
}</code></pre>

@RequiredArgsConstructor
public class CustomUserDetailsService implements UserDetailsService {

  private final UsuarioRepository usuarioRepository;

  @Override
  @Transactional(readOnly = true)
  public UserDetails loadUserByUsername(String email) 
      throws UsernameNotFoundException {

    Usuario u = usuarioRepository.findByCorreoInstitucional(email)
      .orElseThrow(() -> new UsernameNotFoundException(
          "Usuario no encontrado: " + email));
    
    // Forzar carga de relaciones Lazy en la sesión Hibernate
    u.getRoles().forEach(r -> r.getPermisos().size());
    return new CustomUserDetails(u);
  }
}</code></pre>
