<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">Formulario de Usuario</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

    <!-- Navbar Reutilizable -->
    <header th:replace="~{fragments/layout :: mainNavbar}"></header>

    <!-- Alertas Flash -->
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main>
        <h2 th:text="${titulo}">Registrar Usuario</h2>

        <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post">
            
            <!-- Campo oculto para ID (Distingue Crear vs Actualizar) -->
            <input type="hidden" th:field="*{id}" />

            <div>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" th:field="*{nombre}" required />
            </div>

            <div>
                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" th:field="*{apellido}" required />
            </div>

            <div>
                <label for="correo">Correo Institucional:</label>
                <input type="email" id="correo" th:field="*{correoInstitucional}" required />
            </div>

            <div>
                <label for="password">Contraseña:</label>
                <input type="password" id="password" th:field="*{password}" th:required="${usuario.id == null}" placeholder="Dejar en blanco para conservar la actual" />
            </div>

            <div>
                <label for="rolIds">Roles Asignados:</label>
                <select id="rolIds" name="rolIds" multiple size="3" required>
                    <option th:each="r : ${roles}"
                            th:value="${r.id}"
                            th:text="${r.nombre}"
                            th:selected="${usuario.roles != null and usuario.roles.contains(r)}">
                    </option>
                </select>
                <small style="display:block; color:#64748b; margin-top:4px;">
                    Mantén presionado Ctrl (o Cmd en Mac) para seleccionar múltiples roles.
                </small>
            </div>

            <div>
                <button type="submit">Guardar Usuario</button>
                <a th:href="@{/usuarios}" class="button button-secondary">Cancelar</a>
            </div>

        </form>
    </main>

</body>
</html>
